name: Bug report
description: Report a defect in OnlyBackup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted data only: no secrets, personal data, host paths or raw logs.
        Security vulnerabilities must not be reported here: see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: The observed behavior and the expected one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that reproduce the problem, in order.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The released version or the commit you are using.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and runtime versions relevant to the problem.