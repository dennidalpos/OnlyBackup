name: Feature request
description: Suggest an improvement to OnlyBackup
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted data only: no secrets, personal data or host paths.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like and any alternatives you considered.
    validations:
      required: true